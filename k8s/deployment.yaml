apiVersion: apps/v1
kind: Deployment
metadata:
  name: practica2-api-deployment
  namespace: practica2
  labels:
    app: practica2-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practica2-api
  template:
    metadata:
      labels:
        app: practica2-api
    spec:
      containers:
      - name: api-container
        image: practica2-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"